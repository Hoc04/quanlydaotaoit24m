spring.application.name=quanlydaotao

# 1. CẤU HÌNH CHO MÁY LOCAL (Dùng SQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=it24m;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. CẤU HÌNH CHO RENDER (Đọc từ biến môi trường)
# spring.datasource.url=${DB_URL:...}
# spring.datasource.username=${DB_USERNAME:...}
# spring.datasource.password=${DB_PASSWORD:...}
# spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Port
server.port=${PORT:8080}