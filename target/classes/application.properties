spring.application.name=quanlydaotao

# Sử dụng biến môi trường cho Database, mặc định là PostgreSQL local nếu không có biến
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/it24m}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Port cho Render/Railway
server.port=${PORT:8080}