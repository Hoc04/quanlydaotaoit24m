<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn, .form-control, .form-select, .card, .table { border-radius: 0 !important; }
    </style>
</head>
<body class="p-4 bg-light">
    <div class="container bg-white p-4 shadow-sm border">
        
        <!-- Nút quay lại trang chủ -->
        <div class="mb-4">
            <a href="/index.html" class="btn btn-outline-secondary fw-bold">⬅ Quay lại Quản lý Đào tạo</a>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="fw-bold mb-1">Danh sách Sinh Viên</h2>
                <p class="text-muted mb-0">Quản lý thông tin sinh viên toàn trường.</p>
            </div>
            <button class="btn btn-primary fw-bold" onclick="showAddModal()">+ Thêm Sinh Viên</button>
        </div>

        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>Mã SV</th>
                    <th>Họ Tên</th>
                    <th>Email</th>
                    <th>Số Điện Thoại</th>
                    <th>Lớp</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Dữ liệu sẽ được đổ vào đây -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/students';

        async function loadStudents() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                
                data.forEach(st => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${st.studentCode}</td>
                            <td>${st.fullName}</td>
                            <td>${st.email || ''}</td>
                            <td>${st.phone || ''}</td>
                            <td>${st.className || ''}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="deleteStudent('${st.id}')">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Lỗi:", error);
            }
        }

        async function deleteStudent(id) {
            if (confirm('Bạn có chắc muốn xóa sinh viên này?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                loadStudents();
            }
        }

        async function showAddModal() {
            const code = prompt("Nhập mã sinh viên (VD: SV001):");
            const name = prompt("Nhập họ tên:");
            const email = prompt("Nhập email:");
            const className = prompt("Nhập tên lớp:");
            
            if (code && name) {
                const data = { studentCode: code, fullName: name, email: email, className: className };
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                loadStudents();
            }
        }

        // Load dữ liệu khi mở trang
        loadStudents();
    </script>
</body>
</html>
